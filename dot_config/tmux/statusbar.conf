# TokyoNight Storm Status Bar
#
# Palette (official TokyoNight Storm from folke/tokyonight.nvim):
#   #1f2335  bg_dark / bg_statusline
#   #292e42  bg_highlight (raised surface)
#   #1d202f  black (dark text on colored bg)
#   #565f89  comment (inactive/dim)
#   #c0caf5  fg
#   #7aa2f7  blue (session pill)
#   #e0af68  yellow (prefix, zoom)
#   #ff9e64  orange
#   #7dcfff  cyan
#   #f7768e  red
#   #9ece6a  green
#   #bb9af7  magenta (custom sections)

set -g status-style "bg=#1f2335,fg=#c0caf5"
set -g status-left-length 100
set -g status-right-length 220
set -g status-interval 2
set -g clock-mode-style 12
set -g message-style "bg=#1f2335,fg=#c0caf5"

# Left: zoom indicator + session pill.
# Zoom icon is its own segment, always visible (dim when not zoomed, yellow when zoomed).
# Session pill is blue, turns yellow when prefix is active.
set -g status-left "#[fg=#292e42,bg=#1f2335]#{?window_zoomed_flag,#[fg=#e0af68],}󰖯 #[bg=#7aa2f7,fg=#1d202f,bold]#{?client_prefix,#[bg=#e0af68],} #S #[default] "

# Narrow tier: client is under 115 columns. Matched with a regex because tmux's
# ">=" comparison is lexical, not numeric. Referenced as #{E:@is_narrow} so the
# regex lives in one place.
set -g @is_narrow "#{mr:^([0-9]|[1-9][0-9]|10[0-9]|11[0-4])$,#{client_width}}"

# Right: two width tiers. Wide keeps daily | monthly spend and full date pill.
# Narrow drops the date/time pill entirely and shows monthly-only spend rounded
# to whole dollars, no ram total, single-space separators (no dot dividers).
# Metrics are composed in a helper so optional spend segments do not leave
# behind duplicate separators.
set -g @sr_wide "#(~/.config/tmux/scripts/status_metrics.sh)  #[fg=#c0caf5,bg=#292e42] %a %m/%d  %I:%M %p "
set -g @sr_narrow "#(~/.config/tmux/scripts/status_metrics.sh --short) "
set -g status-right "#{?#{E:@is_narrow},#{E:@sr_narrow},#{E:@sr_wide}}"

# Window tabs. Narrow drops the window index and keeps just the name.
set -g @win_index "#{?#{E:@is_narrow},,#{window_index} }"

# Active window tab
set -g window-status-current-format "#[fg=#c0caf5,bg=#292e42] #{E:@win_index}#W "

# Inactive window tab
set -g window-status-format "#[fg=#565f89,bg=default] #{E:@win_index}#W "

set -g window-status-separator ""
set -g window-status-activity-style "bold"
set -g window-status-bell-style "bold"
# vim: ft=tmux
